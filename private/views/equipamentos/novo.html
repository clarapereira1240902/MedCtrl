<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCtrl</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="../../../assets/img/logo.png" type="image/png">

    <!-- Bootstrap CSS & custom CSS --> 
    <link rel="stylesheet" href="../../../assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/css/private.css">
    <link rel="stylesheet" href="../../../assets/css/components.css">

    <!-- Google Fonts --> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet"> 

    <!-- Font Awesome --> 
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css"> 
</head>

<body>
    <!-- NAVBAR -->
    <header class="container-fluid navbar-medctrl">
        <div class="row align-items-center">
            <div class="col-6 d-flex align-items-center">
                <!-- Logo e Nome -->
                <img src="../../../assets/img/logo.png" height="40">
                <h3 class="ms-3 mb-0">MedCtrl</h3>
            </div>

            <div class="col-6 text-end">
                <div class="dropdown">
                    <button class="btn btn-user dropdown-toggle" data-bs-toggle="dropdown"> 
                        <i class="fa-regular fa-user me-2"></i>Utilizador
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="#"><i class="fa-solid fa-key me-2"></i>Alterar password</a>
                        </li>
                        <li><hr></li>
                        <li>
                            <a class="dropdown-item" href="../../../login.html"><i class="fa-solid fa-right-from-bracket me-2"></i>Terminar sessão</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <aside class="col-md-3 col-lg-2 sidebar">
                <nav>
                    <a href="views/dashboard/dashboard.html">
                        <i class="fa-solid fa-chart-line"></i> &ensp; Dashboard
                    </a>
                    <a href="lista.html">
                        <i class="fa-solid fa-laptop-medical"></i> &ensp; Equipamentos
                    </a>
                    <a href="../localizacoes/lista.html">
                        <i class="fa-solid fa-location-dot"></i> &ensp; Localizações
                    </a>
                    <a href="../fornecedores/lista.html">
                        <i class="fa-solid fa-handshake"></i> &ensp; Fornecedores
                    </a>
                    <a href="../documentacao/lista.html">
                        <i class="fa-solid fa-file-medical"></i> &ensp; Documentação
                    </a>
                    <a href="views/garantias/garantias.html">
                        <i class="fa-solid fa-shield-halved"></i> &ensp; Garantias
                    </a>
                </nav>
            </aside>

            <!-- Conteúdo Principal -->
            <main class="col-md-9 col-lg-10 p-4">
                
                <div class="page-header">
                    <h2>
                        <i class="fa-solid fa-plus me-2"></i>
                        Novo Equipamento
                    </h2>
                </div>

                <hr>

                <form class="form-medctrl">

                    <div class="row">
                        
                        <!--Informações gerais do equipamento-->
                        <div class="col-12 mb-3">
                            <h4><i class="fa-solid fa-circle-info me-2"></i>Informação Geral</h4>
                            <hr>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Código de Inventário</label>
                            <input type="text" class="form-control" placeholder="Ex: INV-001">
                        </div>

                        <div class="col-md-8 mb-3">
                            <label class="form-label">Designação</label>
                            <input type="text" class="form-control" placeholder="Ex: Monitor Multiparamétrico">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Categoria</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Número de Série</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fabricante</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Data de Aquisição</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ano de Fabrico</label>
                            <input type="number" class="form-control">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Custo (€)</label>
                            <input type="number" class="form-control">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Tipo de Entrada</label>
                            <select class="form-select">
                                <option>Compra</option>
                                <option>Doação</option>
                                <option>Aluguer</option>
                                <option>Empréstimo</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select">
                                <option>Operacional</option>
                                <option>Em manutenção</option>
                                <option>Avariado</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Criticidade</label>
                            <select class="form-select">
                                <option>Baixa</option>
                                <option>Média</option>
                                <option>Alta</option>
                            </select>
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">Observações</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        
                        <!--Localização do equipamento-->
                        <div class="col-12 mt-4">
                            <h4><i class="fa-solid fa-location-dot me-2"></i>Localização</h4>
                            <hr>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="form-label">Localização</label>
                            <select class="form-select">
                                <option selected>Selecionar localização</option>

                                <option>
                                    Hospital Central - Piso 2 - Cardiologia - Sala 12
                                </option>

                                <option>
                                    Hospital Norte - Piso 1 - Urgência - Sala 3
                                </option>

                                <option>
                                    Hospital Sul - Piso 0 - Radiologia - Sala RX02
                                </option>
                            </select>
                        </div>


                        <!--Fornecedor do equipamento-->
                        <div class="col-12 mt-4">
                            <h4><i class="fa-solid fa-handshake me-2"></i>Fornecedor</h4>
                            <hr>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="form-label">Fornecedor principal</label>
                            <select class="form-select">
                                <option selected>Selecionar fornecedor</option>
                                <option>Dräger Portugal</option>
                                <option>Siemens Healthineers</option>
                                <option>Philips Healthcare</option>
                            </select>
                        </div>


                        <!--Garantias do equipamento-->
                        <div class="col-12 mt-4">
                            <h4><i class="fa-solid fa-shield-halved me-2"></i>Garantia e Manutenção</h4>
                            <hr>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Data início garantia</label>
                            <input type="date"class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Data fim garantia</label>
                            <input type="date"class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contrato de manutenção</label>
                            <select class="form-select">
                                <option selected>Escolher</option>
                                <option>Sim</option>
                                <option>Não</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tipo contrato</label>
                            <select class="form-select">
                                <option selected>Escolher</option>
                                <option>Preventivo</option>
                                <option>Corretivo</option>
                                <option>Preventivo + Corretivo</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Periodicidade</label>
                            <select class="form-select">
                                <option selected>Escolher</option>
                                <option>Mensal</option>
                                <option>Trimestral</option>
                                <option>Semestral</option>
                                <option>Anual</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Entidade responsável</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">Observações da garantia</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>


                        <!-- Botões -->
                        <div class="d-flex justify-content-end gap-2 mb-4"> 
                            <a href="lista.html" class="btn btn-cancel btn-sm"> 
                                <i class="fa-solid fa-xmark me-1"></i> Cancelar 
                            </a> 
                            <button type="submit" class="btn btn-save btn-sm"> 
                                <i class="fa-regular fa-floppy-disk me-1"></i> Guardar 
                            </button> 
                        </div>

                    </div>

                </form>

            </main>
        
        </div>
    </div>

    
<!-- Bootstrap JS and custom JS --> 
<script src="../../../assets/bootstrap/bootstrap.bundle.min.js"></script> 

</body>
</html>
