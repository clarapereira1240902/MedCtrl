<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCtrl</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="../../../assets/img/logo.png" type="image/png">

    <!-- Bootstrap CSS & custom CSS --> 
    <link rel="stylesheet" href="../../../assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/css/private.css">
    <link rel="stylesheet" href="../../../assets/css/components.css">

    <!-- Google Fonts --> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet"> 

    <!-- Font Awesome --> 
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css"> 
</head>

<body>
    <!-- NAVBAR -->
    <header class="container-fluid navbar-medctrl">
        <div class="row align-items-center">
            <div class="col-6 d-flex align-items-center">
                <!-- Logo e Nome -->
                <img src="../../../assets/img/logo.png" height="40">
                <h3 class="ms-3 mb-0">MedCtrl</h3>
            </div>

            <div class="col-6 text-end">
                <div class="dropdown">
                    <button class="btn btn-user dropdown-toggle" data-bs-toggle="dropdown"> 
                        <i class="fa-regular fa-user me-2"></i>Utilizador
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="#"><i class="fa-solid fa-key me-2"></i>Alterar password</a>
                        </li>
                        <li><hr></li>
                        <li>
                            <a class="dropdown-item" href="../../../login.html"><i class="fa-solid fa-right-from-bracket me-2"></i>Terminar sessão</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <aside class="col-md-3 col-lg-2 sidebar">
                <nav>
                    <a href="views/dashboard/dashboard.html">
                        <i class="fa-solid fa-chart-line"></i> &ensp; Dashboard
                    </a>
                    <a href="lista.html">
                        <i class="fa-solid fa-laptop-medical"></i> &ensp; Equipamentos
                    </a>
                    <a href="../localizacoes/lista.html">
                        <i class="fa-solid fa-location-dot"></i> &ensp; Localizações
                    </a>
                    <a href="../fornecedores/lista.html">
                        <i class="fa-solid fa-handshake"></i> &ensp; Fornecedores
                    </a>
                    <a href="views/documentacao/documentacao.html">
                        <i class="fa-solid fa-file-medical"></i> &ensp; Documentação
                    </a>
                    <a href="views/garantias/garantias.html">
                        <i class="fa-solid fa-shield-halved"></i> &ensp; Garantias
                    </a>
                </nav>
            </aside>

            <!-- Conteúdo Principal -->
            <main class="col-md-9 col-lg-10 p-4">

                <div class="page-header">
                    <h2>
                        <i class="fa-solid fa-pen-to-square me-2"></i> Editar Equipamento
                    </h2>

                    <a href="lista.html" class="btn btn-cancel btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Voltar
                    </a>
                </div>

                <form class="form-medctrl">

                    <div class="row">

                        <!-- Coluna esquerda -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Código de Inventário</label>
                                <input type="text" class="form-control" value="EQUIP-2024-001">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Designação</label>
                                <input type="text" class="form-control" value="Monitor de Sinais Vitais">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Categoria</label>
                                <input type="text" class="form-control" value="Monitorização">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" value="Philips">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Modelo</label>
                                <input type="text" class="form-control" value="IntelliVue MX450">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Número de Série</label>
                                <input type="text" class="form-control" value="SN-78451236">
                            </div>
                        </div>

                        <!-- Coluna direita -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Fabricante</label>
                                <input type="text" class="form-control" value="Philips Healthcare">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Data de Aquisição</label>
                                <input type="date" class="form-control" value="2023-06-15">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Ano de Fabrico</label>
                                <input type="number" class="form-control" value="2023">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Custo de Aquisição</label>
                                <input type="text" class="form-control" value="12500">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tipo de Entrada</label>
                                <select class="form-control">
                                    <option selected>Compra</option>
                                    <option>Doação</option>
                                    <option>Aluguer</option>
                                    <option>Empréstimo</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Estado Atual</label>
                                <select class="form-control">
                                    <option selected>Operacional</option>
                                    <option>Em manutenção</option>
                                    <option>Inativo</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Criticidade</label>
                                <select class="form-control">
                                    <option>Baixa</option>
                                    <option selected>Alta</option>
                                    <option>Crítica</option>
                                </select>
                            </div>
                        </div>

                    </div>

                    <!-- Observações -->
                    <div class="mt-3">
                        <label class="form-label">Observações</label>
                        <textarea class="form-control" rows="3">Equipamento em excelente estado. Última manutenção Janeiro 2026.</textarea>
                    </div>

                    <!-- Botões -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="lista.html" class="btn btn-cancel btn-sm">Cancelar</a>

                        <button type="submit" class="btn btn-save btn-sm">
                            <i class="fa-regular fa-floppy-disk me-1"></i>Guardar alterações
                        </button>
                    </div>

                </form>

            </main>
        
        </div>
    </div>

    
<!-- Bootstrap JS and custom JS --> 
<script src="../../../assets/bootstrap/bootstrap.bundle.min.js"></script> 

</body>
</html>
