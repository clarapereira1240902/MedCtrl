<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCtrl</title>

    <!-- Bootstrap CSS & custom CSS --> 
    <link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css"> 
    <link rel="stylesheet" href="assets/css/estilos.css"> 

    <!-- favicon --> 
    <link rel="shortcut icon" href="assets/img/logo.png" type="image/png"> 

    <!-- Font Awesome --> 
    <link rel="stylesheet" href="assets/fontawesome/all.min.css"> 

    <!-- Google Fonts --> 
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;700&display=swap" rel="stylesheet"> 
</head>

<body class="login-body">
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-10">

                <!-- Cartão login -->
                <div class="card shadow border-0 rounded-4 p-4">

                    <!-- Logo + Nome -->
                    <div class="text-center mb-4">
                        <img src="assets/img/logo.png" width="70" class="mb-3">
                        <h2 class="fw-bold medctrl-title">
                            MedCtrl
                        </h2>
                        <p class="text-muted mb-0">
                            Gestão Inteligente de Equipamentos Médicos
                        </p>
                    </div>

                    <!-- Formulário -->
                    <form action="private/dashboard.html" method="post">

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label"> Email </label>
                            <input type="email" class="form-control" id="email" placeholder="Introduza o seu email" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label"> Palavra-passe</label>
                            <input type="password" class="form-control" id="password" placeholder="Introduza a sua palavra-passe" required>
                        </div>

                        <!-- Botão -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary rounded-pill py-2">Entrar
                                <i class="fa-solid fa-right-to-bracket ms-2"></i>
                            </button>
                        </div>

                        <!-- Mensagem erro -->
                        <div class="login-error">
                            <i class="fa-solid fa-circle-exclamation me-2"></i>
                            Email ou palavra-passe inválidos.
                        </div>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
